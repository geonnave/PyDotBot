# Simulator init state for the formation example.
#
# Spawns 22 DotBots scattered across a 2000x2000 mm arena — enough for the
# largest letter in the 5x7 font (B = 20 pixels) plus 2 extras to exercise the
# "park" path. Layout is a 5x5 grid (400 mm spacing) minus 3 cells so the
# Hungarian assignment has interesting work to do.
#
# Use with:
#   dotbot-controller -a dotbot-simulator \
#       --simulator-init-state dotbot/examples/formation/simulator_init_state.toml

[network]
pdr = 100
uplink_pdr = 100
downlink_pdr = 100
slot_duration_ms = 1.236
mqtt_latency_ms = 0.0

# Row y=400 (4 bots, skip x=200)
[[dotbots]]
address = "F02E000000000001"
calibrated = 0xff
pos_x = 600
pos_y = 400
direction = 0
network_mode = "default"

[[dotbots]]
address = "F02E000000000002"
pos_x = 1000
pos_y = 400
direction = 90

[[dotbots]]
address = "F02E000000000003"
pos_x = 1400
pos_y = 400
direction = 180

[[dotbots]]
address = "F02E000000000004"
pos_x = 1800
pos_y = 400
direction = 270

